name: Deploy Server

on:
  push:
    branches:
      - main
    paths:
      - "Server/**"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

concurrency:
  group: production-server
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate Server Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build production image
        run: docker build --tag diproperti-server:${{ github.sha }} .

  deploy:
    name: Redeploy Production Server
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SERVER_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Pull latest commit and redeploy
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_DEPLOY_PATH: ${{ secrets.SERVER_DEPLOY_PATH }}
          SERVER_HEALTHCHECK_URL: ${{ secrets.SERVER_HEALTHCHECK_URL }}
          DEPLOY_COMMIT: ${{ github.sha }}
        run: |
          test -n "$SERVER_HOST"
          test -n "$SERVER_USER"
          test -n "$SERVER_DEPLOY_PATH"
          [[ "$SERVER_DEPLOY_PATH" =~ ^/[a-zA-Z0-9_./-]+$ ]]
          if [ -n "$SERVER_HEALTHCHECK_URL" ]; then
            [[ "$SERVER_HEALTHCHECK_URL" =~ ^https?://[a-zA-Z0-9._:/-]+$ ]]
          fi

          SERVER_PORT="${SERVER_PORT:-22}"

          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$SERVER_PORT" \
            -o BatchMode=yes \
            "$SERVER_USER@$SERVER_HOST" \
            "bash -s -- '$SERVER_DEPLOY_PATH' '$DEPLOY_COMMIT' '$SERVER_HEALTHCHECK_URL'" <<'REMOTE'
          set -Eeuo pipefail

          deploy_path="$1"
          deploy_commit="$2"
          healthcheck_url="$3"

          cd "$deploy_path"
          git checkout main
          git pull --ff-only origin main

          current_commit="$(git rev-parse HEAD)"
          if [ "$current_commit" != "$deploy_commit" ]; then
            echo "Expected commit $deploy_commit, but server is on $current_commit."
            exit 1
          fi

          DEPLOY_HEALTHCHECK_URL="$healthcheck_url" bash Server/scripts/deploy.sh
          REMOTE
