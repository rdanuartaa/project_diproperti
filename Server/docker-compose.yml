services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: properti-app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      - PHP_UPLOAD_MAX_FILESIZE=50M
      - PHP_POST_MAX_SIZE=100M
      - DB_HOST=db
      - DB_DATABASE=properti_db
      - DB_USERNAME=properti_user
      - DB_PASSWORD=properti_pass
    volumes:
      - .:/var/www/html                   
      - /var/www/html/vendor               
      - ./storage:/var/www/html/storage
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    networks:
      - properti-net
    depends_on:
      - db

  webserver:
    image: nginx:alpine
    container_name: properti-web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - properti-net
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: properti-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: properti_db
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: properti_user
      MYSQL_PASSWORD: properti_pass
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - properti-net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: properti-pma
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: secret
    networks:
      - properti-net
    depends_on:
      - db

  prometheus:
    image: prom/prometheus:latest
    container_name: properti-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./docker/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml

    networks:
      - properti-net

  grafana:
    image: grafana/grafana:latest
    container_name: properti-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - properti-net
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:latest
    container_name: properti-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    networks:
      - properti-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: properti-cadvisor
    restart: unless-stopped
    ports:
      - "8082:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - properti-net

networks:
  properti-net:
    driver: bridge

volumes:
  dbdata:
  grafana-data: